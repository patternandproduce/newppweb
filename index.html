<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern &amp; Produce</title>
<meta name="description" content="Pattern &amp; Produce: fashion technology, garment manufacturing and fashion skills training in Lagos.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<script>document.documentElement.className+=" js"</script>
<style>
/* Critical CSS: the opening screen paints instantly, before any JavaScript arrives */
html,body{margin:0;background:#fff}
#loader{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .5s ease,visibility .5s}
#loader.done{opacity:0;visibility:hidden}
#loader .lg{font:600 clamp(1.6rem,6vw,2.4rem)/1.1 'Jost Variable',Jost,Futura,'Century Gothic',sans-serif;letter-spacing:.2em;text-transform:uppercase;animation:lp 1.8s ease-in-out infinite}
#loader .ln{width:min(220px,50vw);height:1px;background:rgba(255,255,255,.25);overflow:hidden}
#loader .ln i{display:block;height:100%;width:40%;background:#fff;animation:ll 1.2s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ll{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
</style>
</head>
<body>
<div id="loader"><div class="lg">Pattern &amp; Produce</div><div class="ln"><i></i></div></div>
<div id="root"></div>
<noscript><style>#loader{display:none}</style><p style="padding:2rem;font-family:sans-serif">Please enable JavaScript to view Pattern &amp; Produce.</p></noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
